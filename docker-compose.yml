version: '3.8'

services:
  citas-api:
    build:
      context: ./api/Citas.Api    # <--- Apuntamos directo a la carpeta del proyecto .csproj
      dockerfile: Dockerfile
    ports:
      - "7044:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__RealConnection=Server=tcp:citas-sql-2026.database.windows.net,1433;Database=citasdb;User ID=citasadmin;Password=P@ssw0rd;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;

    networks:
      - red-citas

  citas-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - citas-api
    networks:
      - red-citas


networks:
  red-citas:
    driver: bridge